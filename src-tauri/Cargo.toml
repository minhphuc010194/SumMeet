[package]
name = "summarize-bot-core"
version = "1.0.1"
description = "SumMeet Desktop Native Audio & Storage Engine (Tauri v2)"
authors = ["default_developer"]
edition = "2021"

[lib]
name = "summarize_bot_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
keyring = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hound = "3.5"
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
