[package]
name = "summarize-bot-core"
version = "1.0.3"
description = "SumMeet Desktop Native Audio & Storage Engine (Tauri v2)"
authors = ["default_developer"]
edition = "2021"

[lib]
name = "summarize_bot_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
keyring = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hound = "3.5"
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.18"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSObject", "NSProcessInfo", "NSString", "NSUUID", "NSValue"] }
